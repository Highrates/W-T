services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: walktalk
      POSTGRES_PASSWORD: walktalk
      POSTGRES_DB: walktalk
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U walktalk -d walktalk']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: walktalk
      MINIO_ROOT_PASSWORD: walktalksecret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-true}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 walktalk walktalksecret;
      mc mb local/walktalk --ignore-existing;
      if [ \"$$MINIO_PUBLIC_READ\" = \"true\" ]; then
        mc anonymous set download local/walktalk;
      else
        mc anonymous set none local/walktalk;
      fi;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
